# Vizion Data-Agent — local / on-prem production stack (Docker Compose)
#
# Topology:
#   browser ──8080──> nginx ──(loopback trust trick)──> app (node :3004, static+api)
#   app (node) ──:3003──> analytics (python uvicorn)
#   app (node) ──spawns──> python bridge subprocess (duplicate-search, loads models)
#
# nginx forwards with Host: 127.0.0.1:3004 and strips Origin so the app's
# isTrustedLocalApiRequest() check (which only trusts loopback) passes WITHOUT
# any code change. See deploy/DEPLOYMENT.md.
#
# Usage:
#   cp deploy/.env.production.example deploy/.env.production   # fill secrets
#   docker compose -f deploy/docker-compose.yml build
#   docker compose -f deploy/docker-compose.yml up -d
#   # colleagues open http://<this-host-ip>:8080

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: vizion:prod
    restart: unless-stopped
    env_file: [deploy/.env.production]
    environment:
      VIZION_API_PORT: "3004"
      VIZION_WEB_PORT: "3004"
      # The app only accepts a LOOPBACK analytics base (analyticsApiConfig.mjs).
      # analytics shares this container's network namespace (see network_mode below),
      # so it is reachable at 127.0.0.1:3003.
      VIZION_ANALYTICS_API_BASE: "http://127.0.0.1:3003"
      VIZION_ANALYTICS_PORT: "3003"
    volumes:
      - vizion-data:/data
    expose:
      - "3004"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3004/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      - analytics

  # analytics shares the app container's network namespace (network_mode), so the
  # Node app reaches it at 127.0.0.1:3003 without violating the loopback-only check.
  analytics:
    image: vizion:prod
    restart: unless-stopped
    network_mode: "service:app"
    command: [".venv/bin/python", "-m", "uvicorn", "backend.analytics.api:app", "--host", "0.0.0.0", "--port", "3003"]
    env_file: [deploy/.env.production]
    environment:
      VIZION_ANALYTICS_PORT: "3003"
    volumes:
      - vizion-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3003/openapi.json || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  vizion-data:
