# nginx for the in-pod deployment (app + analytics + nginx sidecar share the pod
# network, so upstream is 127.0.0.1). Same loopback-trust trick as deploy/nginx.conf.
worker_processes auto;
events { worker_connections 1024; }
http {
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2;

    upstream vizion_app { server 127.0.0.1:3004; keepalive 32; }

    server {
        listen 8080;
        server_name _;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2?|ico)$ {
            proxy_pass http://vizion_app;
            proxy_http_version 1.1; proxy_set_header Connection "";
            proxy_set_header Host "127.0.0.1:3004"; proxy_set_header Origin "";
            add_header Cache-Control "public, max-age=31536000, immutable"; expires 1y;
        }
        location /api/ {
            proxy_pass http://vizion_app;
            proxy_http_version 1.1; proxy_set_header Connection "";
            proxy_set_header Host "127.0.0.1:3004"; proxy_set_header Origin "";
            proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off; proxy_cache off; proxy_read_timeout 300s; proxy_connect_timeout 10s;
        }
        location / {
            proxy_pass http://vizion_app;
            proxy_http_version 1.1; proxy_set_header Connection "";
            proxy_set_header Host "127.0.0.1:3004"; proxy_set_header Origin "";
            proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }
    }
}
