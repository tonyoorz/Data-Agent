# nginx reverse proxy for Vizion Data-Agent
#
# KEY TRICK: the Node app's isTrustedLocalApiRequest() only accepts requests
# whose Host port == apiPort (3004) AND whose Origin is loopback (or absent).
# We therefore rewrite Host to 127.0.0.1:3004 and strip the browser Origin.
# Result: colleagues reach the app over the LAN with zero app-code changes.
#
# For TLS on a real pod, terminate at this layer (certbot / k8s ingress) and set
# proxy_set_header X-Forwarded-Proto $scheme.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Compression for the big JS/CSS bundles -> faster first paint
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/javascript application/json
        application/xml image/svg+xml font/woff2;

    upstream vizion_app {
        server app:3004;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Long-lived immutable cache for content-hashed assets (better UX, less load)
        location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2?|ico)$ {
            proxy_pass http://vizion_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host "127.0.0.1:3004";
            proxy_set_header Origin "";
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
        }

        # API + SSE chat streaming: never buffer, never cache
        location /api/ {
            proxy_pass http://vizion_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host "127.0.0.1:3004";
            proxy_set_header Origin "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
        }

        # Everything else (SPA index.html + client routes): proxy to node,
        # which falls back to index.html for unknown paths.
        location / {
            proxy_pass http://vizion_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host "127.0.0.1:3004";
            proxy_set_header Origin "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
